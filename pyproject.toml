[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "nexus-rpc-sdk"
version = "0.5.0"
description = "Nexus microservice framework Python SDK"
authors = [{name = "Max", email = "claw@maxng.cc"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["msgpack>=1.0"]

[project.urls]
Homepage = "https://github.com/maxesisnclaw/nexus-python-sdk"
Repository = "https://github.com/maxesisnclaw/nexus-python-sdk"

[project.optional-dependencies]
noise = ["dissononce>=0.34"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
