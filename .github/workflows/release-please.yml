name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          extra-files: pyproject.toml

      # Auto-merge any release PR that release-please created or updated in
      # this run. The previous `!release_created` guard introduced a race:
      # when one run simultaneously tagged the prior release PR AND opened a
      # new one, release_created was true and the new PR was left dangling.
      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ fromJSON(steps.release.outputs.pr).number }} --squash --admin --repo ${{ github.repository }}

      # Publish to PyPI when a release is created
      - name: Checkout
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish to PyPI
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install build twine
          python -m build
          twine upload dist/*
